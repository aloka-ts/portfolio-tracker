<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Botanical Forest Green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143425" />
      <stop offset="100%" stop-color="#0B1B13" />
    </linearGradient>

    <!-- Border Glow Gradient: Emerald to Sage -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>

    <!-- Trend Line Gradient: Spring Mint to Emerald to Warm Gold -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <!-- Area Fill Gradient under the chart -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtle Glow Filter for the Trend Line -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base with Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.5" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Botanical Chart Bars in Background -->
  <rect x="6.5" y="18.5" width="3" height="6.5" rx="1.2" fill="#10B981" fill-opacity="0.3" />
  <rect x="11.5" y="14.5" width="3" height="10.5" rx="1.2" fill="#22C55E" fill-opacity="0.4" />
  <rect x="16.5" y="11.5" width="3" height="13.5" rx="1.2" fill="#4ADE80" fill-opacity="0.45" />
  <rect x="21.5" y="7.5" width="3" height="17.5" rx="1.2" fill="#86EFAC" fill-opacity="0.5" />

  <!-- Area under Trend Line -->
  <path d="M 5.5 22.5 L 10.5 17.5 L 15.5 19.5 L 24 8.5 L 24 25.5 L 5.5 25.5 Z" fill="url(#areaGrad)" />

  <!-- High-Precision Dynamic Botanical Trend Line -->
  <g filter="url(#glow)">
    <path
      d="M 5.5 22.5 L 11 16.5 L 16 19 L 24.5 8"
      fill="none"
      stroke="url(#lineGrad)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Arrow Head -->
    <path
      d="M 19 8 H 24.5 V 13.5"
      fill="none"
      stroke="#4ADE80"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Glowing Leading Peak Dot (Warm Organic Accent) -->
  <circle cx="24.5" cy="8" r="1.75" fill="#FFFFFF" />
  <circle cx="24.5" cy="8" r="0.9" fill="#22C55E" />
</svg>
